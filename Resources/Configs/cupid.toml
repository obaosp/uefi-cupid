#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# Measured from cupid's stock uefi.img (HyperOS 3.0.4.0.VLCMIXM): it is an
# ELF64 with one PT_LOAD at vaddr 0xA7000000, memsz 0x2A0000, entry 0xA7000000;
# the uefi partition is exactly 0x2A2000 bytes. The Mu FD must live in that
# window, not at ingres's 0xA7100000.
#
[uefi_fd]
base = 0xA7000000
size = 0x2A2000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
# header_version 0 matches sheng's working image. ingres uses 4; cupid's ABL
# behaviour is unverified, so stage 0 keeps the header the proven port uses.
#
[boot_image]
header_version = 0
base = 0x00000000
kernel_offset = 0x00008000
tags_offset = 0x01e00000
pagesize = 4096
